replicaCount: 1
port: 80
apiBaseUrl: "/api"
image:
  repository: smartdispatch-frontend-service
  tag: "latest"
  pullPolicy: IfNotPresent  # Local image present in k3d node; use IfNotPresent for demos. Prod: push to a real registry.
hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTarget: 70
ingress:
  enabled: true
  host: smartdispatch.local