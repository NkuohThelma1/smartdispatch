apiVersion: v1
kind: Service
metadata:
  name: {{ include "svcname" . }}
  namespace: smartdispatch
  labels:
    app: {{ include "svcname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "svcname" . }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP