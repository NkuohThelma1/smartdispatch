apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: smartdispatch-kafka-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: smartdispatch-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 1Gi
    deleteClaim: false
