apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-delivery-service
  namespace: smartdispatch
spec:
  podSelector:
    matchLabels:
      app: delivery-service
  policyTypes:
    - Ingress
  ingress:
    # Allow Prometheus scraper only — delivery-service is internal, not ingress-exposed
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8003
    # Allow other services within smartdispatch namespace to call /agents/confirm
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: smartdispatch
      ports:
        - protocol: TCP
          port: 8003