apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-analytics-service
  namespace: smartdispatch
spec:
  podSelector:
    matchLabels:
      app: analytics-service
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress controller — /api/stats is publicly exposed
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8005
    # Allow Prometheus scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8005