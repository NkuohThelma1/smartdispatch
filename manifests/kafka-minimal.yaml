apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: smartdispatch-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: "false"
  entityOperator:
    topicOperator: {}
    userOperator: {}
