apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-analytics-service-egress
spec:
  podSelector:
    matchLabels:
      app: analytics-service
  policyTypes:
    - Egress
  egress:
    # Allow outbound to Kafka brokers
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
